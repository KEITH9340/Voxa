```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOXA | Connect. Chat. Share.</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6fb;
    height:100vh;
    overflow:hidden;
    color:#202124;
}

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:270px;
    background:#fff;
    border-right:1px solid #e5e7eb;
    padding:25px 18px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:25px;
    font-weight:bold;
    color:#6c63ff;
    margin-bottom:35px;
}

.logo-icon{
    width:45px;
    height:45px;
    background:#6c63ff;
    color:white;
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
}

nav{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.nav-item{
    border:none;
    background:none;
    padding:14px;
    border-radius:12px;
    display:flex;
    align-items:center;
    gap:14px;
    color:#666;
    cursor:pointer;
    font-size:15px;
    text-align:left;
    transition:.3s;
}

.nav-item:hover{
    background:#f0efff;
    color:#6c63ff;
}

.nav-item.active{
    background:#6c63ff;
    color:white;
}

/* CHAT AREA */
.chat-area{
    flex:1;
    display:flex;
    flex-direction:column;
    background:#fafbff;
}

.chat-header{
    height:75px;
    background:white;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
}

.user-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:linear-gradient(135deg,#6c63ff,#8e85ff);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

.user-name{
    font-weight:bold;
}

.status{
    color:#22c55e;
    font-size:12px;
    margin-top:4px;
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:#f3f4f6;
    cursor:pointer;
    color:#555;
}

.icon-btn:hover{
    background:#6c63ff;
    color:white;
}

/* MESSAGES */
.messages{
    flex:1;
    padding:25px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.message{
    max-width:65%;
    padding:13px 16px;
    border-radius:17px;
    font-size:14px;
    line-height:1.5;
}

.received{
    align-self:flex-start;
    background:#eef0f4;
    border-bottom-left-radius:4px;
}

.sent{
    align-self:flex-end;
    background:#6c63ff;
    color:white;
    border-bottom-right-radius:4px;
}

.message-time{
    display:block;
    font-size:10px;
    opacity:.65;
    text-align:right;
    margin-top:5px;
}

/* INPUT */
.message-input{
    min-height:75px;
    padding:14px 22px;
    background:white;
    border-top:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    gap:10px;
}

.message-input input{
    flex:1;
    height:48px;
    border:none;
    outline:none;
    background:#f3f4f6;
    border-radius:25px;
    padding:0 20px;
    font-size:14px;
}

.send-btn{
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:#6c63ff;
    color:white;
    cursor:pointer;
}

.send-btn:hover{
    background:#5148e5;
    transform:scale(1.05);
}

/* MOBILE */
@media(max-width:768px){

    .sidebar{
        width:70px;
        padding:20px 8px;
    }

    .logo span{
        display:none;
    }

    .logo{
        justify-content:center;
    }

    .nav-item{
        justify-content:center;
    }

    .nav-item span{
        display:none;
    }

    .message{
        max-width:80%;
    }
}

@media(max-width:480px){

    .sidebar{
        width:60px;
    }

    .messages{
        padding:15px;
    }

    .message{
        max-width:88%;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-comment"></i>
            </div>
            <span>VOXA</span>
        </div>

        <nav>

            <!-- CHATS -->
            <button
                class="nav-item active"
                onclick="window.location.href='index.html'">

                <i class="fa-solid fa-comments"></i>
                <span>Chats</span>

            </button>


            <!-- CONTACTS -->
            <button
                class="nav-item"
                onclick="window.location.href='contacts.html'">

                <i class="fa-solid fa-user-group"></i>
                <span>Contacts</span>

            </button>


            <!-- CALLS -->
            <button class="nav-item">

                <i class="fa-solid fa-phone"></i>
                <span>Calls</span>

            </button>


            <!-- NOTIFICATIONS -->
            <button class="nav-item">

                <i class="fa-solid fa-bell"></i>
                <span>Notifications</span>

            </button>


            <!-- SETTINGS -->
            <button class="nav-item">

                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>

            </button>

        </nav>

    </aside>


    <!-- CHAT -->
    <main class="chat-area">

        <header class="chat-header">

            <div class="user-info">

                <div class="avatar">
                    JD
                </div>

                <div>

                    <div class="user-name">
                        John Doe
                    </div>

                    <div class="status">
                        ● Online
                    </div>

                </div>

            </div>


            <div class="header-actions">

                <button class="icon-btn">
                    <i class="fa-solid fa-phone"></i>
                </button>

                <button class="icon-btn">
                    <i class="fa-solid fa-video"></i>
                </button>

                <button class="icon-btn">
                    <i class="fa-solid fa-ellipsis"></i>
                </button>

            </div>

        </header>


        <!-- MESSAGES -->
        <section class="messages">

            <div class="message received">

                Hey! 👋 Welcome to Voxa.

                <span class="message-time">
                    12:30 PM
                </span>

            </div>


            <div class="message sent">

                Thanks! Voxa looks amazing.

                <span class="message-time">
                    12:31 PM
                </span>

            </div>


            <div class="message received">

                This is your new place to connect, chat and share.

                <span class="message-time">
                    12:32 PM
                </span>

            </div>


            <div class="message sent">

                I can't wait to try it! 🚀

                <span class="message-time">
                    12:33 PM
                </span>

            </div>

        </section>


        <!-- MESSAGE INPUT -->
        <div class="message-input">

            <button class="icon-btn">
                <i class="fa-solid fa-paperclip"></i>
            </button>

            <input
                type="text"
                placeholder="Type a message..."
            >

            <button class="send-btn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>

        </div>

    </main>

</div>

</body>
</html>
```
